apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: database
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.Version | quote }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: database
      app.kubernetes.io/part-of: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: {{ .Release.Name }}
        app.kubernetes.io/version: {{ .Chart.Version | quote }}
    spec:
      containers:
        - name: postgres
          image: postgres:17.5-alpine
          env:
            - name: POSTGRES_PASSWORD
              value: supersecret
          readinessProbe:
            exec:
              command: [ pg_isready, --username=postgres ]
            periodSeconds: 3
            timeoutSeconds: 1
            failureThreshold: 10
          livenessProbe:
            exec:
              command: [ pg_isready, --username=postgres ]
            periodSeconds: 3
            timeoutSeconds: 1
            failureThreshold: 10
