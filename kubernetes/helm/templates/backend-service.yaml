apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.Version | quote }}
spec:
  selector:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
